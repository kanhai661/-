<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火灾智能检测系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 头部 */
        .header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #ff6b6b, #ffa502);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: #8892b0;
            font-size: 1.1rem;
        }

        /* 主布局 */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* 卡片样式 */
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }

        .card-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }

        .card-title .icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        /* 上传区域 */
        .upload-zone {
            border: 2px dashed rgba(255,107,107,0.5);
            border-radius: 12px;
            padding: 50px 30px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(255,107,107,0.03);
            position: relative;
            overflow: hidden;
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: #ff6b6b;
            background: rgba(255,107,107,0.08);
            transform: translateY(-2px);
        }

        .upload-zone.dragover::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,107,107,0.1);
            pointer-events: none;
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .upload-text {
            font-size: 1.1rem;
            color: #ccd6f6;
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 0.9rem;
            color: #8892b0;
        }

        .file-input {
            display: none;
        }

        /* 摄像头按钮 */
        .camera-btn {
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .camera-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102,126,234,0.4);
        }

        .camera-btn.active {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }

        /* 预览区域 */
        .preview-area {
            min-height: 300px;
            border-radius: 12px;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .preview-area img, .preview-area video {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
        }

        .preview-placeholder {
            color: #8892b0;
            font-size: 1rem;
            text-align: center;
        }

        /* 摄像头视频 */
        #cameraVideo {
            width: 100%;
            max-height: 400px;
            border-radius: 8px;
            display: none;
        }

        /* 检测按钮 */
        .detect-btn {
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }

        .detect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,107,107,0.4);
        }

        .detect-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 结果区域 */
        .result-panel {
            display: none;
        }

        .result-panel.show {
            display: block;
        }

        .result-status {
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .result-status.fire {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid rgba(231, 76, 60, 0.5);
            color: #e74c3c;
        }

        .result-status.safe {
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid rgba(46, 204, 113, 0.5);
            color: #2ecc71;
        }

        .result-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .detail-item {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
        }

        .detail-label {
            font-size: 0.85rem;
            color: #8892b0;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        /* 历史记录 */
        .history-section {
            margin-top: 30px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .history-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
        }

        .history-item:hover {
            background: rgba(255,255,255,0.08);
            transform: translateX(5px);
        }

        .history-thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background: #2d3748;
        }

        .history-info {
            flex: 1;
        }

        .history-filename {
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .history-time {
            font-size: 0.85rem;
            color: #8892b0;
        }

        .history-result {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .history-result.fire {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }

        .history-result.safe {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
        }

        .history-empty {
            text-align: center;
            padding: 40px;
            color: #8892b0;
        }

        /* 加载动画 */
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,107,107,0.3);
            border-top-color: #ff6b6b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
            display: none;
        }

        .progress-bar.show {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ffa502);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* 清除按钮 */
        .clear-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .clear-btn:hover {
            background: rgba(231, 76, 60, 0.8);
        }

        /* 滚动条美化 */
        .history-list::-webkit-scrollbar {
            width: 6px;
        }

        .history-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: rgba(255,107,107,0.5);
            border-radius: 3px;
        }

        /* 文件信息 */
        .file-info {
            margin-top: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            display: none;
        }

        .file-info.show {
            display: block;
        }

        .file-name {
            color: #ccd6f6;
            font-size: 0.95rem;
        }

        .file-size {
            color: #8892b0;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        /* 下载链接样式 */
        .download-link {
            display: block;
            margin-top: 15px;
            padding: 12px;
            background: rgba(255,107,107,0.15);
            color: #ff6b6b;
            text-align: center;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .download-link:hover {
            background: rgba(255,107,107,0.25);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🔥 火灾智能检测系统</h1>
            <p>基于深度学习的实时火焰与烟雾检测平台</p>
        </div>

        <!-- 主布局 -->
        <div class="main-layout">
            <!-- 左侧：输入区域 -->
            <div class="card">
                <div class="card-title">
                    <div class="icon">📤</div>
                    <span>上传检测</span>
                </div>

                <!-- 拖拽上传区 -->
                <div class="upload-zone" id="uploadZone">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">点击选择文件或拖拽到此处</div>
                    <div class="upload-hint">支持图片 (JPG/PNG) 和视频 (MP4/AVI)</div>
                    <input type="file" class="file-input" id="fileInput" accept="image/*,video/*">
                </div>

                <!-- 文件信息 -->
                <div class="file-info" id="fileInfo">
                    <div class="file-name" id="fileName"></div>
                    <div class="file-size" id="fileSize"></div>
                </div>

                <!-- 进度条 -->
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>

                <!-- 摄像头按钮 -->
                <button class="camera-btn" id="cameraBtn">
                    <span>📷</span>
                    <span id="cameraBtnText">打开摄像头</span>
                </button>

                <!-- 检测按钮 -->
                <button class="detect-btn" id="detectBtn">开始检测</button>

                <!-- 加载中 -->
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <div>正在检测中...</div>
                </div>
            </div>

            <!-- 右侧：预览与结果 -->
            <div class="card">
                <div class="card-title">
                    <div class="icon">👁️</div>
                    <span>预览与结果</span>
                </div>

                <!-- 预览区域 -->
                <div class="preview-area" id="previewArea">
                    <div class="preview-placeholder" id="previewPlaceholder">
                        请选择文件或打开摄像头<br>预览将显示在这里
                    </div>
                    <img id="previewImg" style="display:none;">
                    <video id="previewVideo" style="display:none;" controls></video>
                    <video id="cameraVideo" autoplay playsinline></video>
                    <button class="clear-btn" id="clearBtn">×</button>
                </div>

                <!-- 检测结果面板 -->
                <div class="result-panel" id="resultPanel">
                    <div class="result-status" id="resultStatus">
                        检测中...
                    </div>
                    <div class="result-details">
                        <div class="detail-item">
                            <div class="detail-label">置信度</div>
                            <div class="detail-value" id="confidence">--</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">检测类型</div>
                            <div class="detail-value" id="detectType">--</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">处理时间</div>
                            <div class="detail-value" id="processTime">--</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">目标数量</div>
                            <div class="detail-value" id="targetCount">--</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 检测历史 -->
        <div class="card history-section">
            <div class="card-title">
                <div class="icon">📋</div>
                <span>检测历史</span>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-empty">暂无检测记录</div>
            </div>
        </div>
    </div>

    <script>
        // DOM 元素
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const previewArea = document.getElementById('previewArea');
        const previewPlaceholder = document.getElementById('previewPlaceholder');
        const previewImg = document.getElementById('previewImg');
        const previewVideo = document.getElementById('previewVideo');
        const cameraVideo = document.getElementById('cameraVideo');
        const cameraBtn = document.getElementById('cameraBtn');
        const cameraBtnText = document.getElementById('cameraBtnText');
        const detectBtn = document.getElementById('detectBtn');
        const clearBtn = document.getElementById('clearBtn');
        const loading = document.getElementById('loading');
        const resultPanel = document.getElementById('resultPanel');
        const resultStatus = document.getElementById('resultStatus');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const historyList = document.getElementById('historyList');
        const API_BASE = '';

        let currentFile = null;
        let isCameraActive = false;
        let mediaStream = null;
        let historyData = JSON.parse(localStorage.getItem('fireDetectHistory') || '[]');

        // 初始化历史记录
        loadHistoryFromDB();

        // 拖拽事件
        uploadZone.addEventListener('click', () => fileInput.click());
        
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // 处理文件
        function handleFile(file) {
            // 关闭摄像头（如果打开）
            if (isCameraActive) {
                stopCamera();
            }

            currentFile = file;
            
            // 显示文件信息
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.classList.add('show');

            // 预览
            const url = URL.createObjectURL(file);
            previewPlaceholder.style.display = 'none';
            clearBtn.style.display = 'flex';

            if (file.type.startsWith('image/')) {
                previewImg.src = url;
                previewImg.style.display = 'block';
                previewVideo.style.display = 'none';
                cameraVideo.style.display = 'none';
            } else if (file.type.startsWith('video/')) {
                previewVideo.src = url;
                previewVideo.style.display = 'block';
                previewImg.style.display = 'none';
                cameraVideo.style.display = 'none';
            }

            detectBtn.style.display = 'block';
            resultPanel.classList.remove('show');
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 清除按钮
        clearBtn.addEventListener('click', () => {
            resetPreview();
        });

        function resetPreview() {
            currentFile = null;
            previewImg.style.display = 'none';
            previewVideo.style.display = 'none';
            cameraVideo.style.display = 'none';
            previewPlaceholder.style.display = 'block';
            clearBtn.style.display = 'none';
            detectBtn.style.display = 'none';
            fileInfo.classList.remove('show');
            resultPanel.classList.remove('show');
            fileInput.value = '';
            
            // 清除下载链接
            const existingLink = document.getElementById('videoDownloadLink');
            if (existingLink) existingLink.remove();
            
            if (isCameraActive) {
                stopCamera();
            }
        }

        // 摄像头控制
        cameraBtn.addEventListener('click', async () => {
            if (isCameraActive) {
                stopCamera();
            } else {
                await startCamera();
            }
        });

        async function startCamera() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 1280, height: 720 } 
                });
                cameraVideo.srcObject = mediaStream;
                
                previewPlaceholder.style.display = 'none';
                previewImg.style.display = 'none';
                previewVideo.style.display = 'none';
                cameraVideo.style.display = 'block';
                clearBtn.style.display = 'flex';
                
                cameraBtn.classList.add('active');
                cameraBtnText.textContent = '关闭摄像头';
                isCameraActive = true;
                detectBtn.style.display = 'block';
                resultPanel.classList.remove('show');
                
                // 清除文件选择
                currentFile = null;
                fileInfo.classList.remove('show');
            } catch (err) {
                alert('无法访问摄像头：' + err.message);
            }
        }

        function stopCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            cameraVideo.srcObject = null;
            cameraBtn.classList.remove('active');
            cameraBtnText.textContent = '打开摄像头';
            isCameraActive = false;
            
            if (!currentFile) {
                previewPlaceholder.style.display = 'block';
                cameraVideo.style.display = 'none';
                clearBtn.style.display = 'none';
                detectBtn.style.display = 'none';
            }
        }

        // 检测按钮点击事件，添加视频分支
        detectBtn.addEventListener('click', async () => {
            if (isCameraActive) {
                await detectFromCamera();
            } else if (currentFile) {
                if (currentFile.type.startsWith('video/')) {
                    await detectVideo();
                } else {
                    await detectFromFile();
                }
            }
        });

        // 图片检测
        async function detectFromFile() {
            detectBtn.disabled = true;
            loading.classList.add('show');
            progressBar.classList.add('show');
            resultPanel.classList.remove('show');

            const formData = new FormData();
            formData.append('file', currentFile);

            try {
                // 进度条动画
                let progress = 0;
                const progressInterval = setInterval(() => {
                    progress += Math.random() * 15;
                    if (progress > 90) progress = 90;
                    progressFill.style.width = progress + '%';
                }, 200);

                const response = await fetch(`${API_BASE}/api/detect/image`, {
                    method: 'POST',
                    body: formData
                });

                clearInterval(progressInterval);
                progressFill.style.width = '100%';

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const result = await response.json();

                if (result.success) {
                    // 显示标注后的图片
                    if (result.resultImage) {
                        previewImg.src = result.resultImage;
                        previewImg.style.display = 'block';
                        previewVideo.style.display = 'none';
                        cameraVideo.style.display = 'none';
                    }

                    showResult({
                        hasFire: result.hasFire,
                        confidence: result.confidence,
                        type: result.hasFire ? '火焰/烟雾' : '无异常',
                        count: result.count,
                        time: result.processTime + 's'
                    });

                    addToHistory({
                        hasFire: result.hasFire,
                        confidence: result.confidence,
                        type: result.hasFire ? '火焰/烟雾' : '无异常',
                        count: result.count,
                        time: result.processTime + 's',
                        thumbnail: result.resultImage
                    });
                } else {
                    alert('检测失败：' + result.error);
                }

            } catch (err) {
                alert('请求错误：' + err.message);
                console.error(err);
            } finally {
                loading.classList.remove('show');
                progressBar.classList.remove('show');
                progressFill.style.width = '0%';
                detectBtn.disabled = false;
            }
        }

        // 视频检测
        async function detectVideo() {
            if (!currentFile || !currentFile.type.startsWith('video/')) return;

            detectBtn.disabled = true;
            loading.classList.add('show');
            progressBar.classList.add('show');
            resultPanel.classList.remove('show');

            const formData = new FormData();
            formData.append('file', currentFile);

            try {
                // 视频处理进度条（慢速增长）
                let progress = 0;
                const progressInterval = setInterval(() => {
                    progress += 2;
                    if (progress > 95) progress = 95;
                    progressFill.style.width = progress + '%';
                }, 500);

                const response = await fetch(`${API_BASE}/api/detect/video`, {
                    method: 'POST',
                    body: formData
                });

                clearInterval(progressInterval);
                progressFill.style.width = '100%';

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const result = await response.json();

                if (result.success) {
                    showResult({
                        hasFire: result.fireFrames > 0,
                        confidence: result.fireFrames > 0 ? (result.fireFrames / result.totalFrames) : 0,
                        type: result.fireFrames > 0 ? '检测到火灾帧' : '无异常',
                        count: result.fireFrames,
                        time: '已完成'
                    });

                    // 添加下载链接
                    const existingLink = document.getElementById('videoDownloadLink');
                    if (existingLink) existingLink.remove();

                    const downloadLink = document.createElement('a');
                    downloadLink.id = 'videoDownloadLink';
                    downloadLink.href = `${API_BASE}${result.downloadUrl}`;
                    downloadLink.download = `detected_${currentFile.name}`;
                    downloadLink.textContent = '⬇️ 下载处理后的视频';
                    downloadLink.className = 'download-link';
                    resultPanel.appendChild(downloadLink);

                    addToHistory({
                        hasFire: result.fireFrames > 0,
                        confidence: result.fireFrames > 0 ? (result.fireFrames / result.totalFrames) : 0,
                        type: result.fireFrames > 0 ? '视频-火灾' : '视频-安全',
                        count: result.fireFrames,
                        time: '已完成',
                        thumbnail: null
                    });
                } else {
                    alert('视频检测失败：' + result.error);
                }

            } catch (err) {
                alert('视频检测错误：' + err.message);
                console.error(err);
            } finally {
                loading.classList.remove('show');
                progressBar.classList.remove('show');
                progressFill.style.width = '0%';
                detectBtn.disabled = false;
            }
        }

        //摄像头检测
        async function detectFromCamera() {
            detectBtn.disabled = true;
            loading.classList.add('show');
            resultPanel.classList.remove('show');

            // 截取当前帧
            const canvas = document.createElement('canvas');
            canvas.width = cameraVideo.videoWidth || 1280;
            canvas.height = cameraVideo.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(cameraVideo, 0, 0);
            
            const base64Image = canvas.toDataURL('image/jpeg', 0.8);

            try {
                const response = await fetch(`${API_BASE}/api/detect/camera`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ frame: base64Image })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const result = await response.json();

                if (result.success) {
                    // 如果有火灾，显示标注图；否则保持摄像头画面
                    if (result.resultImage) {
                        previewImg.src = result.resultImage;
                        previewImg.style.display = 'block';
                        cameraVideo.style.display = 'none';
                    }

                    showResult({
                        hasFire: result.hasFire,
                        confidence: result.confidence,
                        type: result.hasFire ? '火焰/烟雾' : '无异常',
                        count: result.count,
                        time: '实时'
                    });

                    addToHistory({
                        hasFire: result.hasFire,
                        confidence: result.confidence,
                        type: result.hasFire ? '火焰/烟雾' : '无异常',
                        count: result.count,
                        time: '实时',
                        thumbnail: result.resultImage || base64Image
                    });
                } else {
                    alert('摄像头检测失败：' + result.error);
                }

            } catch (err) {
                alert('摄像头检测错误：' + err.message);
                console.error(err);
            } finally {
                loading.classList.remove('show');
                detectBtn.disabled = false;
            }
        }

        // 显示结果
        function showResult(result) {
            resultPanel.classList.add('show');
            
            if (result.hasFire) {
                resultStatus.className = 'result-status fire';
                resultStatus.innerHTML = '⚠️ 检测到火灾风险！';
            } else {
                resultStatus.className = 'result-status safe';
                resultStatus.innerHTML = '✅ 未检测到火灾';
            }

            document.getElementById('confidence').textContent = (result.confidence * 100).toFixed(1) + '%';
            document.getElementById('detectType').textContent = result.type;
            document.getElementById('processTime').textContent = result.time;
            document.getElementById('targetCount').textContent = result.count;
        }

        // 添加到历史记录
        function addToHistory(result) {
    const item = {
        id: result.recordId || Date.now(),  // 用数据库返回的 ID
        time: new Date().toLocaleString('zh-CN'),
        filename: currentFile ? currentFile.name : (isCameraActive ? '摄像头检测' : '未知'),
        hasFire: result.hasFire,
        confidence: result.confidence,
        thumbnail: result.thumbnail || null
    };

    // 插到最前面
    historyData.unshift(item);
    if (historyData.length > 50) historyData.pop();

    renderHistory();
}

        // 渲染历史记录
        async function loadHistoryFromDB() {
    try {
        const response = await fetch(`${API_BASE}/api/history?limit=50`);
        const result = await response.json();

        if (result.success && result.data) {
            // 把数据库数据转换为前端需要的格式
            historyData = result.data.map(item => ({
                id: item.id,
                time: new Date(item.created_at).toLocaleString('zh-CN'),
                filename: item.filename || '未知',
                hasFire: item.has_fire === 1,
                confidence: item.confidence || 0,
                count: item.count || 0,
                // 数据库不存缩略图，用占位图
                thumbnail: null
            }));
            renderHistory();
        } else {
            historyList.innerHTML = '<div class="history-empty">暂无检测记录</div>';
        }
    } catch (err) {
        console.error('加载历史记录失败:', err);
        // 失败时回退到 localStorage
        renderHistory();
    }
}

// ========== 渲染历史记录（修改后的版本）==========
function renderHistory() {
    if (historyData.length === 0) {
        historyList.innerHTML = '<div class="history-empty">暂无检测记录</div>';
        return;
    }

    historyList.innerHTML = historyData.map(item => `
        <div class="history-item">
            <img class="history-thumb" src="${item.thumbnail || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22><rect width=%2260%22 height=%2260%22 fill=%22%232d3748%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%238892b0%22 font-size=%2220%22>📷</text></svg>'}" alt="">
            <div class="history-info">
                <div class="history-filename">${item.filename}</div>
                <div class="history-time">${item.time}</div>
            </div>
            <div class="history-result ${item.hasFire ? 'fire' : 'safe'}">
                ${item.hasFire ? '🔥 火灾' : '✅ 安全'}
            </div>
        </div>
    `).join('');
}

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isCameraActive) {
                stopCamera();
            }
            if (e.key === 'Enter' && detectBtn.style.display === 'block' && !detectBtn.disabled) {
                detectBtn.click();
            }
        });
    </script>
</body>
